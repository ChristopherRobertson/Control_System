schema_version: "1.0"
registry_id: EVIDENCE-LOCATIONS-001
policy: Existing completed and in-progress evidence is preserved in canonical phase packages; relocation changes paths only, never observations or status.
procedural_writeup_policy:
  standard: docs/data_contract/procedural_writeup_standard.md
  canonical_filename: procedural_writeup.md
  required_before_new_completion: true
  historical_backfill_register: campaigns/instrument_readiness_001/reports/procedural_writeup_backfill_register.md
  reacquisition_for_documentation_only: prohibited
locations:
  P0: {path: evidence/calibration/system_recalibration_001/phases/P0, disposition: immutable_historical_source}
  S0: {path: evidence/calibration/system_recalibration_001/phases/S0, disposition: immutable_historical_source}
  MS-01: {path: evidence/calibration/system_recalibration_001/phases/MS-01, disposition: immutable_historical_source}
  MS-02: {path: evidence/calibration/system_recalibration_001/phases/MS-02, disposition: immutable_historical_source}
  T2-01: {path: evidence/calibration/system_recalibration_001/phases/T2-01, disposition: immutable_historical_source}
  T1-01: {path: evidence/calibration/system_recalibration_001/phases/T1-01, disposition: immutable_historical_source}
  PT-01: {path: evidence/calibration/system_recalibration_001/phases/PT-01, disposition: immutable_historical_source}
  MC-01: {path: evidence/calibration/system_recalibration_001/phases/MC-01, disposition: immutable_historical_source}
  TR-01: {path: evidence/calibration/system_recalibration_001/phases/TR-01, disposition: immutable_historical_source}
  OM-01: {path: evidence/calibration/system_recalibration_001/phases/OM-01, disposition: immutable_historical_source}
  HF-01: {path: evidence/calibration/system_recalibration_001/phases/HF-01, disposition: immutable_historical_source}
  WM-01: {path: evidence/calibration/system_recalibration_001/phases/WM-01, disposition: resume_existing_run}
  CH-00: {path: evidence/characterization/system_characterization_001/phases/CH-00, disposition: immutable_historical_source}
future_default:
  path_template: evidence/{evidence_domain}/{campaign_id}/phases/{phase_id}/runs/{phase_run_id}
  disposition: append_only_after_indexing
