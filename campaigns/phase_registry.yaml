schema_version: "1.0"
registry_id: PHASE-REGISTRY-001
authority: campaigns/phase_registry.yaml
status_vocabulary:
  historical_complete: completed evidence is immutable and imported
  in_progress: resume the existing phase run
  planned: no execution or observation is implied
  optional: outside the HRP core promotion path

completion_policy:
  procedural_writeup_standard: docs/data_contract/procedural_writeup_standard.md
  required_artifact: procedural_writeup.md
  required_before_new_completion_or_advance: true
  required_before_promotion_or_thesis_reuse: true
  historical_scientific_disposition_preserved: true
  historical_documentation_tracking: campaigns/instrument_readiness_001/reports/procedural_writeup_backfill_register.md
  backfill_requires_reacquisition: false

campaigns:
  instrument-readiness-001:
    purpose: Unified calibration characterization validation and HRP-readiness path
    core_path: true
  hrp-001:
    purpose: First biological campaign
    core_path: true
  mbco-cryo-001:
    purpose: Optional cryogenic MbCO branch after HRP handoff
    core_path: false

