[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-spectroscope-control-system"
version = "0.1.0"
description = "Control and acquisition software for the IR spectroscope"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "pyserial>=3.5",
  "zhinst>=26.4.1",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
test = ["pytest>=8"]

[project.scripts]
control-system-gui = "control_app.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["control_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
