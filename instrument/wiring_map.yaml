schema_version: '0.1'
source:
  file: instrument/wiring_table.xlsx
  sheet: Sheet1
  range: A1:F165
  generated_from_spreadsheet: true
  notes:
  - This file separates fixed wiring from hardware identity configuration.
  - Preferred routing uses the confirmed timing architecture where spreadsheet rows
    conflict.
  - Operator-reported detector wiring update, 2026-08-31; each detector signal passes
    through its own female-to-female BNC adapter, then a male-to-two-female BNC tee.
    Detector 1 (sample) branches to HF2LI Signal 1 In (+) and PicoScope CHA;
    detector 2 (reference) branches to HF2LI Signal 2 In (+) and PicoScope CHB.
    Both receivers remain connected. PicoScope CHA and CHB carry detector signals,
    not T660 trigger signals, in this default wiring.
  - Legacy spreadsheet labels "RS232 7" and "RS232 6" mean the Surelite Nd:YAG
    DB9 EXT TTL fire-command pin 7 and Q-switch-command pin 6. They are not
    RS-232 electrical-level signals and must never be driven as an RS-232 port.
  - Arduino MUX boards are bypassed/inactive until rewired; HF2LI DIO16-DIO22
    inputs do not mirror to HF2LI DIO9-DIO15 outputs.
  - MIRcat DB9 pin 5 is reserved for Laser Output On/Off and is disconnected.
    DB9 pins 6 and 8 are unused and unwired in the installed topology.
  - The phrase "default wiring restored" includes both detector split paths,
    T660-1 CHD disconnected,
    MIRcat DB9 pin 5 disconnected, and MIRcat DB9 pins 6 and 8 unused/unwired.
    These remain standing conditions unless the operator explicitly reports a
    change; see instrument/default_wiring_state.md.
  - Manufacturer correspondence is preserved at
    references/manuals/MIRcat/daylight_db9_process_trigger_correspondence.md.
detector_signal_paths:
