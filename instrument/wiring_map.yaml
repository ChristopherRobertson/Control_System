breakouts:
  hf2li_dio_breakout:
    note: DIO numbers denote logical bits in the HF2LI complete DIO word, not connector pin numbers. The
      P0 MIRcat DIO mapping side experiment identifies DB9 pins 1/2/3 as bits 20/21/22. The input edges
      and parallel Sweep Active branch require route-transfer qualification in MS-02.1 and MD-01.
    inputs:
      DIO16: surelite_ndyag.fixed_sync_out
      DIO17: surelite_ndyag.variable_sync_out
      DIO18: surelite_ndyag.flashlamp_sync_out
      DIO19: mircat.trig_out
      DIO20: mircat.db9_1_scan_direction
      DIO21: mircat.db9_2_tuned_sweep_active
      DIO22: mircat.db9_3_wavelength_trigger
      DIO23-DIO31: null
    inactive_outputs_to_muxes:
      DIO9: dmb1_dmb2_dmb3.C0
      DIO10: dmb1_dmb2_dmb3.C1
      DIO11: dmb1_dmb2_dmb3.C2
      DIO12: dmb1_dmb2_dmb3.C3
      DIO13: dmb1_dmb2_dmb3.C4
      DIO14: dmb1_dmb2_dmb3.C5
      DIO15: dmb1_dmb2_dmb3.C6
    timing_inputs:
      DIO0_EXT_REF: t660_1.CHA
      DIO1_DAQ_TRIGGER: null
    mapping_evidence: campaigns/instrument_readiness_001/phases/P0/mircat_dio_mapping_side_experiment.md
    inactive_analog_outputs_to_muxes:
      AUX1: amb1_amb2.C0
      AUX2: amb1_amb2.C1
      AUX3: amb1_amb2.C2
      AUX4: amb1_amb2.C3
  mircat_db9_breakout:
    pin_1:
      signal: scan_direction
      direction: output
      destination: hf2li.DIO20
    pin_2:
      signal: tuned_sweep_active
      direction: output
      destination: hf2li.DIO21
      parallel_destination: picoscope.EXT
      split_count: 2
      input_loading: High-impedance inputs on both branches; no 50-ohm terminator.
      signal_ground_pin: 7
    pin_3:
      signal: wavelength_trigger
      direction: output
      destination: hf2li.DIO22
    pin_4:
      signal: process_trigger
      direction: input
      source: t660_2.CHC
    pin_5:
      signal: reserved
      connection: DISCONNECTED
      direction: input
      source: null
    pin_6:
      signal: interlock
      direction: output
      destination: null
    pin_7:
      signal: ground
      direction: bidirectional
      destination: ground_bus
    pin_8:
      signal: remote_on_off
      direction: input
      source: null
    pin_9:
      signal: ground
      direction: bidirectional
      destination: ground_bus
generated_warnings: []
optional_acquisition_window:
  destination: hf2li.DIO1
  connected: false
  candidate_source: t660_2.D
  note: DIO1 has no source in default wiring. A frame-relative gate may use T660-2 D after an explicit
    route assignment and qualification.
