breakouts:
  hf2li_dio_breakout:
    note: DIO numbers denote logical bits in the HF2LI complete DIO word, not connector
      pin numbers. The confirmed MIRcat DIO mapping identifies DB9 pins 1/2/3 as bits
      20/21/22. The input edges and parallel Sweep Active branch require installed
      route-transfer qualification.
    inputs:
      DIO16: surelite_ndyag.fixed_sync_out
      DIO17: surelite_ndyag.variable_sync_out
      DIO18: surelite_ndyag.flashlamp_sync_out
      DIO19: mircat.trig_out
      DIO20: mircat.db9_1_scan_direction
      DIO21: mircat.db9_2_tuned_sweep_active
      DIO22: mircat.db9_3_wavelength_trigger
      DIO23-DIO31: null
    timing_inputs:
      DIO0_EXT_REF: t660_1.CHA
      DIO1_DAQ_TRIGGER: null
    mapping_status: bit_identity_confirmed_route_transfer_not_qualified
  mircat_db9_breakout:
    pin_1:
      signal: scan_direction
      direction: output
      destination: hf2li.DIO20
    pin_2:
      signal: tuned_sweep_active
      direction: output
      destination: hf2li.DIO21
      parallel_destination: picoscope.EXT
      split_count: 2
      input_loading: High-impedance inputs on both branches; no 50-ohm terminator.
      signal_ground_pin: 7
    pin_3:
      signal: wavelength_trigger
      direction: output
      destination: hf2li.DIO22
    pin_4:
      signal: process_trigger
      direction: input
      source: t660_2.CHC
    pin_5:
      signal: reserved
      connection: DISCONNECTED
      direction: input
      source: null
    pin_6:
      signal: interlock
      direction: output
      destination: null
    pin_7:
      signal: ground
      direction: bidirectional
      destination: ground_bus
    pin_8:
      signal: remote_on_off
      direction: input
      source: null
    pin_9:
      signal: ground
      direction: bidirectional
      destination: ground_bus
generated_warnings: []
optional_acquisition_window:
