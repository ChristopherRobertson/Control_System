schema_version: '0.2'
source:
  file: instrument/wiring_table.xlsx
  sheet: Sheet1
  range: A1:F165
  generated_from_spreadsheet: true
  notes:
  - Fixed wiring and hardware identity are represented separately; this table matches instrument/default_wiring_state.md.
  - T660-2 is the 10 MHz reference master and the pump/process trains-and-frames sequencer. T660-1 generates
    the continuous reference, probe, and frame-input pulse train.
  - Detector 1 (sample) branches through its BNC adapter and tee to HF2LI Signal 1 In (+) and PicoScope
    CHA; detector 2 (reference) branches to Signal 2 In (+) and PicoScope CHB. Both receivers remain connected.
  - Surelite DB9 EXT pins 7 and 6 are TTL Fire and Q-switch command inputs, not RS-232 electrical-level
    signals.
  - Arduino MUX boards are inactive and bypassed. HF2LI DIO16-DIO22 inputs do not mirror to DIO9-DIO15
    outputs.
  - Both T660 channel-D outputs are SPARE, unwired and disabled. HF2LI DIO1 has no default source.
  - MIRcat DB9 pin 2 branches to HF2LI DIO21 and PicoScope EXT; DIO20 is Scan Direction from pin 1. DIO
    numbers identify logical bits, not connector-pin numbers.
  - MIRcat DB9 pins 5, 6 and 8 are disconnected. Pin 7 provides the Sweep Active branch ground reference.
  - Manufacturer Process Trigger correspondence is retained in references/manuals/MIRcat/daylight_db9_process_trigger_correspondence.md.
