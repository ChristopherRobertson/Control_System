arduino_mux_control:
  active: false
  status: inactive_bypassed
  disabled_reason: Arduino MUX controls are disabled in software until the MUX is rewired and requalified.
  power:
    5V:
    - dmb1.VCC
    - dmb2.VCC
    - dmb3.VCC
    - amb1.VCC
    - amb2.VCC
    GND: ground_bus
  enable_pins:
    D2: dmb1.EN
    D3: dmb2.EN
    D4: amb1.EN
    D5: amb2.EN
    A0: dmb3.EN
  select_buses:
    output_a_bus:
      D6: S0
      D7: S1
      D8: S2
      D9: S3
      boards:
      - dmb1
      - amb1
    output_b_bus:
      D10: S0
      D11: S1
      D12: S2
      D13: S3
      boards:
      - dmb2
      - amb2
    output_ext_bus:
      A1: S0
      A2: S1
      A3: S2
      A4: S3
      boards:
      - dmb3
  unused_pins:
  - D0
  - D1
  - A5
breakouts:
  hf2li_dio_breakout:
    note: Physical breakout labels are recorded below, but the corresponding complete-DIO-word bit indices for MIRcat DB9 pins 1-3 remain unverified and must be measured before calibrated sweep acquisition.
    inputs:
      DIO16: surelite_ndyag.fixed_sync_out
      DIO17: surelite_ndyag.variable_sync_out
      DIO18: surelite_ndyag.flashlamp_sync_out
      DIO19: mircat.trig_out
      DIO20: mircat.db9_1_scan_direction
      DIO21: mircat.db9_2_tuned_sweep_active
      DIO22: mircat.db9_3_wavelength_trigger
      DIO23-DIO31: null
    inactive_outputs_to_muxes:
      DIO9: dmb1_dmb2_dmb3.C0
      DIO10: dmb1_dmb2_dmb3.C1
      DIO11: dmb1_dmb2_dmb3.C2
      DIO12: dmb1_dmb2_dmb3.C3
      DIO13: dmb1_dmb2_dmb3.C4
      DIO14: dmb1_dmb2_dmb3.C5
      DIO15: dmb1_dmb2_dmb3.C6
    timing_inputs:
      DIO0_EXT_REF: t660_2.CHA
      DIO1_DAQ_TRIGGER: t660_2.CHC
    analog_outputs:
      AUX1: amb1_amb2.C0
      AUX2: amb1_amb2.C1
      AUX3: amb1_amb2.C2
      AUX4: amb1_amb2.C3
  mircat_db9_breakout:
    pin_1:
      signal: scan_direction
      direction: output
      destination: hf2li.DIO20
    pin_2:
      signal: tuned_sweep_active
      direction: output
      destination: hf2li.DIO21
    pin_3:
      signal: wavelength_trigger
      direction: output
      destination: hf2li.DIO22
    pin_4:
      signal: process_trigger
      direction: input
      source: t660_1.CHC
    pin_5:
      signal: reserved
      connection: DISCONNECTED
      direction: input
      source: null
    pin_6:
      signal: interlock
      direction: output
      destination: null
    pin_7:
      signal: ground
      direction: bidirectional
      destination: ground_bus
    pin_8:
      signal: remote_on_off
      direction: input
      source: null
    pin_9:
      signal: ground
      direction: bidirectional
      destination: ground_bus
generated_warnings:
- issue: MIRcat TRIG IN appears inconsistent.
  spreadsheet_rows:
  - T660-2 CHB -> MIRcat TRIG IN
  - MIRcat TRIG IN <- T660-1 CHA
  recommended_resolution: 'Use the confirmed architecture: T660-2 CHB -> MIRcat TRIG
    IN.'
- issue: HF2LI DIO 0 / ExtRef appears inconsistent.
  spreadsheet_rows:
  - T660-2 CHA -> HF2LI DIO 0
  - HF2LI DIO 0 (Ext Ref) <- T660-2 CHC
  recommended_resolution: 'Use the confirmed architecture: T660-2 CHA -> HF2LI DIO
    0 / ExtRef.'
- issue: Arduino D5 row appears inconsistent.
  spreadsheet_rows:
  - AMB2 EN <- Arduino D5
  - Arduino D5 -> EN AMB1
  recommended_resolution: Use Arduino D5 -> AMB2 EN.
