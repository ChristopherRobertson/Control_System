    source: Sample Detector output
    connection_sequence:
    - female-to-female BNC adapter
    - male-to-two-female BNC tee
    destinations:
    - device: hf2li
      signal: Signal 1 In (+)
    - device: picoscope_5244d
      signal: Channel A
    split_count: 2
  reference:
    source: Reference Detector output
    connection_sequence:
    - female-to-female BNC adapter
    - male-to-two-female BNC tee
    destinations:
    - device: hf2li
      signal: Signal 2 In (+)
    - device: picoscope_5244d
      signal: Channel B
    split_count: 2
