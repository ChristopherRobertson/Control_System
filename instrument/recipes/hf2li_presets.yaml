schema_version: "0.1"
description: "Real HF2LI LabOne presets for calibration and characterization qualification. These presets do not create simulated data."
source_reference: "docs/operating_procedures/ui_hardware_control_reference.md HF2LI LabOne Configuration"
presets:
  dark_baseline:
    purpose: "Detector dark baseline with QCL emission off and pump blocked."
    operator_checks:
      - "Confirm QCL emission is off before acquisition."
      - "Confirm pump beam is blocked before acquisition."
      - "Confirm CH1/CH2 are connected to the approved detector outputs."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 60.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "evidence/experiments/runs/YYYYMMDD_hf2li_60s_record"

  qcl_reference_baseline:
    purpose: "QCL-on reference baseline with pump blocked at the phase-approved probe condition."
    operator_checks:
      - "Confirm pump beam is blocked."
      - "Confirm MIRcat setpoint/actual wavelength is logged in the run manifest."
      - "Confirm detector response is within approved dynamic range before continuing."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 60.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"

  detector_alignment:
    purpose: "Continuous MIRcat detector-alignment setup for LabOne Plotter visualization with DIO0 external reference. Demodulator streaming stays continuous; DIO1 is unconnected in default wiring."
    operator_checks:
      - "Confirm T660-1 CHA is connected to HF2LI DIO0 external reference."
      - "Confirm T660-1 CHB is connected to MIRcat TRIG IN before opening MIRcat emission."
      - "T660-1 CHC feeds the T660-2 frame input and is disabled during detector alignment; DIO1 is unconnected."
      - "Confirm detector response remains within approved dynamic range during alignment."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
    labone_plotter:
      mode: "Use LabOne Plotter directly; the UI does not replicate detector plotting."
      plotter_run_mode: "roll mode with continuous demodulator samples; DIO1 has no default source"
      api_control: false
      note: "LabOne Plotter trigger configuration is UI/session state. Open LabOne and add the listed signals manually. The workflow intentionally leaves demods/{0,3}/trigger at 0 to avoid gating the demodulator sample stream."
      signals:
        - ui_tree: "Demodulators/1/Sample/R"
          api_path: "demods/0/sample.r"
          role: "Detector channel 1 magnitude"
        - ui_tree: "Demodulators/4/Sample/R"
          api_path: "demods/3/sample.r"
          role: "Detector channel 2 magnitude"
      trigger:
        source: null
        ui_tree: "Continuous display; no DIO1 trigger connection"
        demodulator_trigger_node: "demods/{0,3}/trigger"
        demodulator_trigger_value: 0
        trigger_name: "continuous demodulator stream"
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "evidence/experiments/runs/YYYYMMDD_mircat_detector_alignment"

  detector_alignment_internal:
    purpose: "MIRcat internal-pulse detector alignment for LabOne Plotter visualization without T660 timing."
    operator_checks:
      - "Confirm MIRcat is configured for internal pulsed emission before opening emission."
      - "Confirm detector response remains within approved dynamic range during alignment."
      - "Use LabOne Plotter directly; add Demod 1 Sample R and Demod 4 Sample R."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: false
    oscillators:
      - index: 0
        frequency_hz: 2000000.0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
    labone_plotter:
      mode: "Use LabOne Plotter directly; the UI does not replicate detector plotting."
      plotter_run_mode: "roll mode with continuous demodulator samples using HF2LI oscillator 0 at 2 MHz"
      api_control: false
      note: "This mode does not require T660-1. It uses the HF2LI internal oscillator at the nominal MIRcat pulse rate for live alignment display."
      signals:
        - ui_tree: "Demodulators/1/Sample/R"
          api_path: "demods/0/sample.r"
          role: "Detector channel 1 magnitude"
        - ui_tree: "Demodulators/4/Sample/R"
          api_path: "demods/3/sample.r"
          role: "Detector channel 2 magnitude"
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "evidence/experiments/runs/YYYYMMDD_mircat_detector_alignment_internal"

  campaign_step_scan_candidate:
    purpose: "Provisional engineering seed for separate HRP-C-CO and MbCO HF-01/AR-01 qualification; not evidence that their settings are equivalent and not approved for biological acquisition."
    qualification_plan: "campaigns/instrument_readiness_001/phases/HF-01/planning_basis.md"
    operator_checks:
      - "Confirm the approved calibration or characterization phase ID before acquisition."
      - "Confirm MIRcat setpoint/actual wavelength and full configuration are saved for every point."
      - "Do not use this candidate after HF-01/AR-01 without replacing it with the accepted configuration ID."
      - "Qualify acquisition rate, time constant, filter order, settling/bias, noise/SNR, clipping, loss, and record envelope separately for HRP-C-CO and MbCO."
      - "Retain separate HRP-C-CO and MbCO configuration IDs even if measured equivalence supports identical numeric settings."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"

  campaign_sweep_qualification_candidate:
    purpose: "Provisional full-DIO sweep settings for HF-01, MD-01, and MSW-01 qualification; not approved for SV-02 or biological acquisition."
    operator_checks:
      - "Confirm the approved calibration phase and stable readback directory."
      - "Confirm MIRcat actual wavelength/readback and the complete DIO word are retained."
      - "Replace this candidate with the accepted HF-01 configuration ID before downstream use."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      # LabOne Demodulator 3 (API index 2) carries the global DIO word used
      # for sweep timing. It is intentionally not assigned to a detector.
      - index: 2
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        # At 5 kSa/s a 500 us MIRcat wavelength-trigger pulse spans about
        # 2.5 samples. The sweep workflow applies and verifies the pulse width.
        rate_sps: 5000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"

  regular_phase_scan_single_detector:
    purpose: "Regular single-detector phase scan. Filter/order/rates are resolved from connected HF2LI capabilities and frozen for the complete blank/sample sequence."
    operator_checks:
      - "Connect the detector to HF2LI CH1 SIG IN +; load the buffer blank and acquire the complete matching sequence with pump inhibited."
      - "Load the sample, acquire and review the preliminary unpumped absorption spectrum, then explicitly start the pumped scan."
      - "Use 250 us FIRE-to-Q-switch timing. Time is relative to recorded electrical pump sync; optical arrival is not calibrated."
      - "Retain controller markers and native CH1/DIO records; unsupported coverage remains missing."
      - "Seed filter values below are retained readbacks for preview. The maintained regular executor replaces them with supported resolved values and verifies actual readbacks."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.00004999538607626059
        rate_sps: 28782.894736842107
        trigger: 0
        enable: true
      - index: 2
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.0010018887078828383
        rate_sps: 230263.15789473685
        trigger: 0
        enable: true
      - index: 1
        enable: false
      - index: 3
        enable: false
      - index: 4
        enable: false
      - index: 5
        enable: false
    acquisition:
      demodulators: [0]
      timing_demodulator_api_index: 2
      fields: ["x", "y", "r"]
      detector_mode: single_ch1_buffer_blank
      reference_source: sequence_matched_buffer_blank
      read_policy: deferred
      expected_output: "Phase Scan/<UTC date>/<run id>"

  exploratory_phase_scan_single_detector:
    purpose: "Temporary single-detector phase reconstruction; CH1 signal divided by a previously acquired buffer-blank spectrum. Exploratory only."
    operator_checks:
      - "Connect the single detector to HF2LI CH1 SIG IN + (API signal input 0); CH2 is unused."
      - "Capture a pump-blocked buffer blank before installing the sample, with identical scan range, direction, speed and HF2LI settings."
      - "Inspect positive, unsaturated CH1 signal and retain the native buffer blank as the spectral ratio denominator."
      - "Retain the unpumped sample baseline separately; current output is absorbance relative to the buffer blank, without baseline subtraction."
      - "Keep the T660 probe clock and DIO0 reference, DIO17 pump sync, DIO21 Sweep Active and DIO22 marker wiring unchanged."
      - "Verify CH1 detector readback at 28782.894736842107 Sa/s; retain actual timing rate after LabOne quantization."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.00005
        rate_sps: 28782.894736842107
        trigger: 0
        enable: true
      # DIO observation remains independent of the single optical stream.
      # Fixed for blank and sample; changing phase increment never changes it.
      - index: 2
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 200000.0
        trigger: 0
        enable: true
      - index: 1
        enable: false
      - index: 3
        enable: false
      - index: 4
        enable: false
      - index: 5
        enable: false
    acquisition:
      duration_s: 5.0
      demodulators: [0]
      timing_demodulator_api_index: 2
      fields: ["x", "y", "r"]
      detector_mode: single_ch1_buffer_blank
      reference_source: prior_buffer_blank
      expected_output: "EXPLORATORY_PHASE_SCAN_RUN_DIRECTORY"

  exploratory_phase_scan_poc:
    purpose: "Disposable MbCO single-scan phase-delay proof of concept; not a campaign-qualified detector configuration and not eligible for publication."
    operator_checks:
      - "Confirm sample and reference detector inputs are positive and unsaturated at the selected 750 mA MIRcat current."
      - "Confirm the 10 cm-1 sweep is centered on the experimentally observed MbCO A1 maximum."
      - "Capture and inspect a pump-blocked background and test sweep before enabling photolysis."
      - "Retain the configured and read-back detector rates, time constants, input ranges, and overload status with the exploratory run."
      - "Verify both detector streams read back at 28782.894736842107 Sa/s; this installed HF2LI rounds a 20000 Sa/s request down to 14391.447368421053 Sa/s."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.00005
        rate_sps: 28782.894736842107
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.00005
        rate_sps: 28782.894736842107
        trigger: 0
        enable: true
      # API index 2 carries the global DIO word. The Phase-Scan adapter raises
      # this timing-stream rate from the saved seed value when the phase step
      # requires denser observation of Sweep Active and wavelength markers.
      - index: 2
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 5000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "EXPLORATORY_PHASE_SCAN_RUN_DIRECTORY"
