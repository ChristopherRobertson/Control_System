name: ndyag_alignment_10hz
description: 'Nd:YAG DAT Mode 2 alignment: T660-1 C supplies 10 Hz triggers; T660-2 A/B supply Fire and Q-switch.'
approved_laser_safety_condition: true
workflow_entrypoint: control_app.ui.widgets.ndyag_widget.NdYagWidget
standalone_t660_only: true
duration:
  mode: continuous
  t660_shots: 0
  stop_condition: Press Safe Idle in the Nd:YAG UI tab when beam alignment is complete.
timing:
  repetition_rate_hz: 10
  period_ms: 100
  pulse_width_us: 10
  surelite_dat_mode: 2
  surelite_fire_to_lasing_us: 180
  surelite_q_switch_to_lasing_ns: 170
  target_fire_to_q_switch_delay_ns: 179830
  programmed_fire_delay_ns: 0
  programmed_q_switch_delay_ns: 179830
  timing_calibration_status: UNCALIBRATED_NOMINAL_TARGET
  timing_correction_source: null
routes:
  t660_1_drive: T660-1 CHC -> T660-2 TRIG IN
  ndyag_fire: T660-2 CHA -> Nd:YAG Fire command
  ndyag_q_switch: T660-2 CHB -> Nd:YAG Q-switch command
operator_prerequisites:
- Surelite DAT Mode 2 enabled with external Q-switch selected.
- Surelite START/STOP and SHUTTER are on before loading the continuous 10 Hz timing workflow.
- Nd:YAG beam path is enclosed or otherwise approved for alignment operation.
- Press Safe Idle before leaving the alignment setup unattended.
t660:
  t660_2:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    trigger_source: EXT
    force_eod: true
    channels:
      A:
        delay: 0ns
        width: 10us
        polarity: negative
        termination: 50OHM
        enabled: true
      B:
        delay: 179830ns
        width: 10us
        polarity: negative
        termination: 50OHM
        enabled: true
      C:
        delay: 0ns
        width: 10ms
        polarity: negative
        termination: 50OHM
        enabled: false
      D:
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
    frames_engine: 'OFF'
    start: true
    external_trigger:
      polarity: positive
      termination: 50OHM
      threshold_v: 2.0
  t660_1:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    trigger_source: SYN
    force_eod: true
    channels:
      A:
        enabled: false
      B:
        enabled: false
      C:
        delay: 0ns
        width: 10us
        polarity: positive
        termination: 50OHM
        enabled: true
      D:
        enabled: false
    clock:
      frequency: 10Hz
      shots: 0
    start: true
