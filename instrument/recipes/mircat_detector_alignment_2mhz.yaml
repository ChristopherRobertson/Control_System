name: mircat_detector_alignment_2mhz
description: 'Detector alignment: continuous 2 MHz HF2LI DIO0 reference and MIRcat optical trigger from T660-1.'
approved_laser_safety_condition: true
alignment_intent: Align detectors using the direct T660-1 A/B reference and probe routes.
workflow_entrypoint: software/tests/hardware_checks/check_mircat_detector_alignment.py
standalone_t660_only: true
duration:
  mode: continuous
  t660_shots: 0
  stop_condition: Stop T660-1 or apply instrument/recipes/safe_idle.yaml when alignment is complete.
timing:
  repetition_rate_hz: 2000000
  period_ns: 500
  pulse_width_ns: 150
  duty_cycle_fraction: 0.3
mircat_pulse_setup:
  qcl: 1
  pulse_rate_hz: 2000000
  pulse_width_ns: 150
  pulse_mode: external_trigger
  pulse_mode_value: 2
  process_trigger_mode: internal
  process_trigger_mode_value: 1
  current_ma: 1000.0
  wavenumber_cm1: 1850.0
  emission_gate_required_before_t660_start: true
hf2li_setup:
  preset: detector_alignment
  external_reference:
    input: DIO0
    pll_adcselect: 4
    frequency_hz: 2000000.0
  plotter_trigger:
    input: null
    role: Continuous display; DIO1 is unconnected in default wiring.
    demodulator_trigger_node: demods/{0,3}/trigger
    demodulator_trigger_value: 0
    trigger_mode: continuous demodulator stream
routes:
  hf2li_extref: T660-1 CHA -> HF2LI DIO0 external reference BNC
  mircat_trig_in: T660-1 CHB -> MIRcat TRIG IN
operator_prerequisites:
- Use software/tests/hardware_checks/check_mircat_detector_alignment.py for the ordered MIRcat + T660 workflow.
- Open LabOne Plotter and add detector demodulator R traces before or after starting alignment; the UI will
  not duplicate LabOne plotting.
- Do not apply this T660-only recipe standalone unless the MIRcat is already configured, armed, tuned, and
  intentionally emission-enabled.
- Apply instrument/recipes/safe_idle.yaml or otherwise stop T660-1 before leaving the alignment setup unattended.
t660:
  t660_2:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    trigger_source: 'OFF'
    force_eod: true
    channels:
      A:
        enabled: false
      B:
        enabled: false
      C:
        enabled: false
      D:
        enabled: false
    frames_engine: 'OFF'
  t660_1:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    trigger_source: SYN
    force_eod: true
    channels:
      A:
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: true
      B:
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: true
      C:
        enabled: false
      D:
        enabled: false
    clock:
      frequency: 2MHz
      shots: 0
    start: true
