name: phase_scan_pulse_coverage
description: "Exploratory dual-detector PicoScope record triggered directly by MIRcat DB9 pin 2 Tuned / Sweep Active for missing-pulse coverage analysis."
approved_laser_safety_condition: false
wiring:
  channel_a: "Sample detector optical output"
  channel_b: "Reference detector optical output (primary optical-pulse witness)"
  external_trigger: "High-impedance probe branch from MIRcat DB9 pin 2 Tuned / Sweep Active; the existing route to HF2LI DIO21 remains connected"
  external_trigger_ground: "MIRcat DB9 pin 7 ground"
  t660_1_channel_c: "MIRcat DB9 pin 4 Process Trigger"
  t660_1_channel_d: "DISCONNECTED AND DISABLED"
trigger_contract:
  trigger_basis: "mircat_sweep_active"
  status: "EXPLORATORY_DIRECT_TRIGGER"
  configuration_id: "EXPLORATORY-MIRCAT-DB9-PIN2-TO-PICOSCOPE-EXT"
  publication_eligible: false
  sweep_start_offset_us: 0.0
  policy: "PicoScope trigger time is the observed rising edge of MIRcat DB9 pin 2 Tuned / Sweep Active. This exploratory configuration is not a campaign qualification or promoted configuration."
picoscope:
  capture_mode: "one_block_per_qcl_sweep_segment"
  capture_settings:
    resolution: "8BIT"
    channels:
      A:
        enabled: true
        coupling: "DC"
        range: "5V"
        analog_offset_v: 0.0
      B:
        enabled: true
        coupling: "DC"
        range: "10V"
        analog_offset_v: 0.0
    external_trigger:
      source: "EXT"
      threshold_adc: 5000
      threshold_policy: "Verify the installed pin-2 low/high levels before acquisition and set the threshold between them; 5000 counts is only the initial direct-lead candidate."
      direction: 2
      direction_name: "rising"
      delay_samples: 0
      auto_trigger_ms: 0
    timebase: 4
    preferred_sample_interval_ns: 16.0
    maximum_sample_interval_ns: 48.0
    pre_trigger_duration_us: 10.0
    post_trigger_margin_us: 250.0
    duration_margin_fraction: 0.05
    total_samples: 100000
    pre_trigger_samples: 625
    timeout_s: 15.0
    pulse_count_threshold_adc: 0
    pulse_count_threshold_policy: "Unused compatibility field; optical thresholds are derived locally after capture and this value must not classify detector pulses."
  pulse_detection:
    threshold_fraction_of_local_amplitude: 0.30
    local_window_opportunities: 100
    saturation_check_fraction_of_adc_range: 0.98
    minimum_signal_to_noise_ratio: 6.0
