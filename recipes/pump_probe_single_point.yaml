name: pump_probe_single_point
description: "Single-point pump/probe scaffold with laser-driving T660 outputs disabled until approved."
wavelength_key: lambda_mid
delay_ns: 0
acquisition_duration_s: 5
approved_laser_safety_condition: false
t660:
  t660_2:
    stop_first: true
    clock:
      frequency: 2MHz
      shots: 0
    trigger_source: "OFF"
    force_eod: true
    signals:
      hf2li_extref:
        delay: 0
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      hf2li_daq_trigger:
        delay: 0
        width: 2ms
        polarity: positive
        termination: 50OHM
        enabled: false
      mircat_trig_in:
        delay: 0
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      t660_1_trig_in:
        delay: 0
        width: 1ms
        polarity: positive
        termination: 50OHM
        enabled: false
  t660_1:
    stop_first: true
    trigger_source: "OFF"
    force_eod: true
    signals:
      ndyag_fire:
        delay: 0
        width: 10us
        polarity: positive
        termination: 50OHM
        enabled: false
      ndyag_q_switch:
        delay: 0
        width: 10us
        polarity: positive
        termination: 50OHM
        enabled: false
      mircat_db9_pin_4_process_trigger:
        enabled: false
      mircat_db9_pin_5_laser_output_on_off:
        enabled: false
hf2li_preset: pump_probe_acquisition
pico_capture_settings:
  source: workflow_recipe
  status: MEASUREMENT_SPECIFIC_RECIPE_REQUIRED
