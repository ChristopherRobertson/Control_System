name: mircat_detector_alignment_2mhz
description: "Detector alignment timing: continuous 2 MHz HF2LI Ext Ref and MIRcat trigger from T660-2."
approved_laser_safety_condition: true
alignment_intent: "Align detectors with the MIRcat beam using the direct T660-2 timing routes."
workflow_entrypoint: "tests/hardware_checks/check_mircat_detector_alignment.py"
standalone_t660_only: true
duration:
  mode: continuous
  t660_shots: 0
  stop_condition: "Stop T660-2 or apply recipes/safe_idle.yaml when alignment is complete."
timing:
  repetition_rate_hz: 2000000
  period_ns: 500
  pulse_width_ns: 150
  duty_cycle_fraction: 0.30
mircat_pulse_setup:
  qcl: 1
  pulse_rate_hz: 2000000
  pulse_width_ns: 150
  pulse_mode: external_trigger
  pulse_mode_value: 2
  process_trigger_mode: internal
  process_trigger_mode_value: 1
  current_ma: preserve_existing
  wavenumber_cm1: operator_selected
  emission_gate_required_before_t660_start: true
routes:
  hf2li_extref: "T660-2 CHA -> HF2LI DIO 0 external reference BNC"
  mircat_trig_in: "T660-2 CHB -> MIRcat TRIG IN"
operator_prerequisites:
  - "Use tests/hardware_checks/check_mircat_detector_alignment.py for the ordered MIRcat + T660 workflow."
  - "Do not apply this T660-only recipe standalone unless the MIRcat is already configured, armed, tuned, and intentionally emission-enabled."
  - "Apply recipes/safe_idle.yaml or otherwise stop T660-2 before leaving the alignment setup unattended."
t660:
  t660_1:
    stop_first: true
    trigger_source: "OFF"
    force_eod: true
    channels:
      A:
        enabled: false
      B:
        enabled: false
      C:
        enabled: false
      D:
        enabled: false
  t660_2:
    stop_first: true
    clock:
      frequency: 2MHz
      shots: 0
    trigger_source: "SYN"
    force_eod: true
    start: true
    signals:
      hf2li_extref:
        delay: 0
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: true
      mircat_trig_in:
        delay: 0
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: true
      hf2li_daq_trigger:
        enabled: false
      t660_1_trig_in:
        enabled: false
