schema_version: "0.1"
name: "polystyrene_fast_sweep"
description: "Fast rewired MIRcat sweep for Polystyrene spectral validation. Article plots and computed values are exported outside this UI repo."
approved_laser_safety_condition: true

sample:
  name: "Polystyrene"
  article_metadata_required:
    - "sample presentation geometry"
    - "FTIR instrument/model"
    - "FTIR resolution, apodization, scan count, and background procedure"
    - "LabOne Plotter export or HF2LI data export with MIRcat TRIG OUT marker"

required_wiring:
  mircat_trig_out_to_hf2li_dio0: true
  mircat_trig_out_to_hf2li_dio1: true
  disconnect_t660_2_chb_from_mircat_trig_in: true
  note: "Use a splitter or equivalent routing if MIRcat TRIG OUT must feed both HF2LI DIO0 EXT REF and HF2LI DIO1 Plotter trigger."

probe:
  qcl: 1
  mircat:
    wavenumber_cm1: 2076.0
    qcl: 1
    tec_timeout_s: 120.0
    tune_timeout_s: 120.0
    poll_interval_s: 0.5
    pulse_rate_hz: 2000000.0
    pulse_width_ns: 150.0
    current_ma: 1000.0
    pulse_mode: internal
    emission_allowed: true
  fast_sweep_cm1:
    start: 2076.0
    stop: 1640.0
    scan_rate_cm1_s: 43.6
    repetitions: 1
    installed_range_cm1:
      min: 1638.8
      max: 2077.3

timing:
  use_t660_ext_ref: false
  t660_reference_recipe: "recipes/hf2li_extref_2mhz.yaml"
  pre_sweep_record_s: 1.0
  post_sweep_record_s: 1.0
  axis_model: "linear_between_MIRcat_TRIG_OUT_emission_edges"

hf2li_preset: "standard_spectral_validation"
hf2li:
  preset: "standard_spectral_validation"
  labone_plotter:
    trigger_input: "DIO1"
    trigger_edge: "RISE"
    role: "Plotter trigger/marker from MIRcat TRIG OUT; not a demodulator transfer trigger."
    demodulator_trigger_value: 0

pump:
  enabled: false
  source: "not used for spectral validation"

controls:
  - "dark_baseline_qcl_off"
  - "open_beam_or_reference_baseline"
  - "repeat_fast_sweep_if_baseline_or_detector_response_is_unstable"

file_naming:
  spectral_run_dir: "calibration/YYYYMMDD_HHMMSS_polystyrene_fast_sweep"
  raw_hf2li_file: "hf2li_raw_fast_sweep.csv"
  manifest_name: "run_manifest.json"
  command_log_name: "command_log.txt"

go_no_go_criteria:
  go:
    - "MIRcat TRIG OUT is connected to HF2LI DIO0 EXT REF."
    - "MIRcat TRIG OUT is connected or split to HF2LI DIO1."
    - "T660-2 CHB is not connected to MIRcat TRIG IN."
    - "LabOne Plotter is set to DIO1 rising if the Plotter export is being used for time-to-wavenumber mapping."
    - "MIRcat setpoint, sweep settings, HF2LI snapshot, command log, and run manifest are written."
  no_go:
    - "MIRcat TRIG OUT is not available on HF2LI DIO0 and DIO1."
    - "Detector response clips or remains at noise level after alignment."
    - "The MIRcat manufacturer UI owns the SDK session."
    - "FTIR source metadata are missing for article spectral comparison."
