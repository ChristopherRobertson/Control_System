schema_version: "0.1"
name: "myoglobin_co_validation"
description: "Workflow-based RSI spectral-validation scan for Myoglobin-CO. Article metrics are exported outside this UI repo."
approved_laser_safety_condition: true

sample:
  name: "Myoglobin-CO"
  article_metadata_required:
    - "protein concentration"
    - "buffer and path length"
    - "CO handling and sample state"
    - "FTIR instrument/model, geometry, resolution, scans, and background procedure"

probe:
  qcl: 1
  mircat:
    wavenumber_cm1: 1858.0
    qcl: 1
    tec_timeout_s: 120.0
    tune_timeout_s: 120.0
    poll_interval_s: 0.5
    pulse_rate_hz: 2000000.0
    pulse_width_ns: 150.0
    pulse_mode: external_trigger
    pulse_mode_value: 2
    emission_allowed: true
  scan_cm1:
    start: 1848.0
    stop: 1868.0
    step: 1.0
    dwell_s_per_point: 5.0
    include:
      - 1858.0
    installed_range_cm1:
      min: 1638.8
      max: 2077.3
  co_band_scan_cm1:
    start: 1848.0
    stop: 1868.0
    step: 1.0
    include:
      - 1858.0
    dwell_s_per_point: 5.0
    installed_range_cm1:
      min: 1638.8
      max: 2077.3

pump:
  enabled: false
  source: "not used for spectral validation"

delay_list_ns:
  - 0
timing_recipe: "recipes/mircat_detector_alignment_2mhz.yaml"
hf2li_preset: "myoglobin_co_spectrum"
picoscope_recipe: "recipes/picoscope_settings_test.yaml"

controls:
  - "dark_baseline_qcl_off_pump_blocked"
  - "qcl_reference_baseline_pump_blocked"
  - "repeat_scan_without_changing_alignment"

file_naming:
  spectral_run_dir: "calibration/YYYYMMDD_myoglobin_co_validation"
  raw_hf2li_pattern: "hf2li_raw_scan_{point_index}.csv"
  manifest_name: "run_manifest.json"
  command_log_name: "command_log.txt"

go_no_go_criteria:
  go:
    - "hardware_configuration.yaml hash is present in the run manifest."
    - "MIRcat manufacturer UI is closed and single-client SDK ownership is available."
    - "Sample preparation, path length, CO handling, and FTIR source metadata are recorded."
    - "MIRcat setpoint and actual wavelength are recorded for every point."
  no_go:
    - "Any required real device handshake fails or is unavailable."
    - "Any required direct timing or detector route is undefined in hardware_configuration.yaml."
    - "Detector response clips or remains at noise level after alignment."
    - "Sample or FTIR metadata are missing for article spectral-validation claims."
