schema_version: "0.1"
name: "mircat_sweep_scan"
description: "Segmented MIRcat spectral sweep calibrated from Sweep Active and Wavelength Trigger DIO inputs."
approved_laser_safety_condition: true
workflow_entrypoint: "control_app.workflows.mircat_widget_commands:mircat.start_sweep_scan"

wiring_contract:
  t660_2_a: "HF2LI EXT REF / DIO0 BNC"
  t660_2_b: "MIRcat TRIG IN BNC"
  t660_2_c: "HF2LI DIO1 BNC; unused during this sweep recipe"
  t660_2_d: "T660-1 TRIG IN; disabled during this unpumped sweep"
  t660_1_c: "MIRcat DB9 pin 4 Process Trigger; held inactive pending GUI confirmation"
  t660_1_d: "DISCONNECTED AND UNUSED"
  mircat_db9_pin_1: "HF2LI DIO input: Scan Direction"
  mircat_db9_pin_2: "HF2LI DIO input: Sweep Active; high only during each QCL channel sweep"
  mircat_db9_pin_3: "HF2LI DIO input: Wavelength Trigger calibration pulse"

mircat:
  qcl: 1
  start_cm1: 2050.0
  stop_cm1: 1650.0
  scan_rate_cm1_s: 40.0
  repetitions: 1
  pulse_rate_hz: 2000000.0
  pulse_width_ns: 150.0
  pulse_mode: external_trigger
  process_trigger_mode: internal
  external_process_trigger_gui_confirmed: false
  emission_control: "control_application_sdk"

hf2li:
  preset: myoglobin_co_spectrum
  external_reference: "T660-2 CHA at 2 MHz"
  acquisition:
    mode: "labone_streaming_dio_segmented"
    timing_demodulator_api_index: 2
    timing_demodulator_labone_label: 3
    trigger_signal: "Demod 3 DIO (API index 2)"
    # Fill these only from the empirical complete-DIO-word test. The workflow
    # fails preflight while experimentally_confirmed is false or any bit is null.
    confirmed_dio_mapping:
      experimentally_confirmed: false
      scan_direction_bit: null
      sweep_active_bit: null
      wavelength_trigger_bit: null
    wavelength_trigger_interval_cm1: 5.0
    wavelength_trigger_pulse_width_us: 500
    pre_padding_s: 0.10
    stream_start_delay_s: 0.05
    # Must cover the 10 s commanded motion plus unknown inter-channel gaps.
    stream_record_s: 30.0
    sweep_validity: "retain detector samples only while the confirmed Sweep Active bit is high"
    wavelength_axis: "5 cm^-1 Wavelength Trigger anchors interpolated independently inside each active segment"

t660:
  t660_1:
    stop_first: true
    trigger_source: "OFF"
    force_eod: true
    channels:
      A: {enabled: false}
      B: {enabled: false}
      C: {enabled: false}
      D: {enabled: false}
  t660_2:
    stop_first: true
    clock: {frequency: 2MHz, shots: 0}
    trigger_source: "SYN"
    force_eod: true
    start: true
    signals:
      hf2li_extref: {delay: 0ns, width: 150ns, polarity: positive, termination: 50OHM, enabled: true}
      mircat_trig_in: {delay: 0ns, width: 150ns, polarity: positive, termination: 50OHM, enabled: true}
      hf2li_daq_trigger: {enabled: false}
      t660_1_trig_in: {enabled: false, role: "Unused for sweep scans; never enable this 2 MHz route."}
