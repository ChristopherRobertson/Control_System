name: timing_calibration
description: "Safe base state for the complete operator-guided timing calibration; all outputs remain disabled."
approved_laser_safety_condition: false
procedure:
  implementation: "control_app.workflows.timing_calibration_procedure.TimingCalibrationProcedure"
  review_document: "docs/timing_calibration_procedure.md"
  time_origins:
    t_master: "First programmed T660-2 timing event (recipe/programming zero)."
    t_chem: "Optical OPO pulse arrival at the sample, established by TC-07."
  electrical_programmed_delays_ns: [0, 100, 1000, 10000, 100000, 1000000]
  default_shots_per_point: 100
  measurement_system_setups:
    - "MS-00A splitter normal"
    - "MS-00B splitter branches swapped"
    - "MS-00C exact installed Step 7 splitter/Q-switch-cable/monitor-lead geometry"
  optical_corrections_required_before_execution:
    - "photodetector response plus upstream detector-lead delay"
    - "standard uncertainty of that response-delay correction"
    - "detector identifier, characterization source, and characterization date"
    - "detector output-cable identifier"
    - "sample or sample-equivalent path description and path-placement standard uncertainty"
    - "reviewed maximum Q-switch-to-OPO latency defining the optical search window"
    - "documented MS-00C load-equivalence method for the Nd:YAG Q-switch input"
    - "standard uncertainty assigned to load equivalence"
    - "identifiers for splitter, channel-assigned scope assemblies, final Q-switch cable, and Step 7 monitor lead"
  picoscope_capture_policy:
    automatic_timebase_and_window: true
    maximum_samples_per_trace: 150000
    includes_one_millisecond_in_same_run: true
  optical_exposure_policy:
    t660_2_trigger_source: "REM"
    beam_blocked_control_shots: 1
    live_preview_shots: 1
    default_measurement_shots_after_preview: 100
    default_maximum_total_remote_shots: 102
    scope_armed_before_every_remote_trigger: true
    minimum_interval_shared_across_control_preview_and_measurement: true
    t660_1_and_t660_2_elapsed_shot_counter_match_required: true
  trigger_rates_hz:
    direct_t660_2: 100
    any_step_involving_t660_1: 10
    optical_step: 10
  execution_policy:
    plan_review_before_hardware: true
    pause_before_each_cable_setup: true
    explicit_laser_safety_confirmation: true
    unique_run_directory: true
    overwrite_existing_run_data: false
    publish_to_rsi_draft: false
    publish_to_canonical_calibration: false
t660:
  t660_2:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    frames_engine: "OFF"
    clock:
      frequency: 100Hz
      # T660 TRIG:SHOTS resets the elapsed-shot counter; it is not a finite-shot limit.
      shots: 0
    trigger_source: "OFF"
    force_eod: true
    signals:
      hf2li_extref:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      hf2li_daq_trigger:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      mircat_trig_in:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      t660_1_trig_in:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
  t660_1:
    stop_first: true
    predivider: 1
    gate_mode: 0
    burst_enabled: false
    external_trigger:
      polarity: "positive"
      termination: "50OHM"
      threshold_v: 2.0
    trigger_source: "OFF"
    force_eod: true
    signals:
      ndyag_fire:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      ndyag_q_switch:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
      mircat_db9_pin_4_process_trigger:
        timing_mode: delay_width
        delay: 0ns
        width: 150ns
        polarity: positive
        termination: 50OHM
        enabled: false
