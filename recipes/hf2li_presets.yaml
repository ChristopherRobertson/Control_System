schema_version: "0.1"
description: "Real HF2LI LabOne presets for calibration and characterization qualification. These presets do not create simulated data."
source_reference: "docs/ui_hardware_control_reference.md HF2LI LabOne Configuration"
presets:
  dark_baseline:
    purpose: "Detector dark baseline with QCL emission off and pump blocked."
    operator_checks:
      - "Confirm QCL emission is off before acquisition."
      - "Confirm pump beam is blocked before acquisition."
      - "Confirm CH1/CH2 are connected to the approved detector outputs."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 60.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "runs/YYYYMMDD_hf2li_60s_record"

  qcl_reference_baseline:
    purpose: "QCL-on reference baseline with pump blocked at the phase-approved probe condition."
    operator_checks:
      - "Confirm pump beam is blocked."
      - "Confirm MIRcat setpoint/actual wavelength is logged in the run manifest."
      - "Confirm detector response is within approved dynamic range before continuing."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 60.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"

  detector_alignment:
    purpose: "Continuous MIRcat detector-alignment setup for LabOne Plotter visualization with DIO0 external reference. Demodulator streaming stays continuous; use DIO1 only as the LabOne Plotter UI trigger if needed."
    operator_checks:
      - "Confirm T660-2 CHA is connected to HF2LI DIO0 external reference."
      - "Confirm T660-2 CHB is connected to MIRcat TRIG IN before opening MIRcat emission."
      - "Confirm T660-2 CHC is connected to HF2LI DIO1 if using the LabOne Plotter trigger controls."
      - "Confirm detector response remains within approved dynamic range during alignment."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
    labone_plotter:
      mode: "Use LabOne Plotter directly; the UI does not replicate detector plotting."
      plotter_run_mode: "roll mode with continuous demodulator samples; configure DIO1 as a LabOne Plotter UI trigger only when a triggered display is needed"
      api_control: false
      note: "LabOne Plotter trigger configuration is UI/session state. Open LabOne and add the listed signals manually. The workflow intentionally leaves demods/{0,3}/trigger at 0 to avoid gating the demodulator sample stream."
      signals:
        - ui_tree: "Demodulators/1/Sample/R"
          api_path: "demods/0/sample.r"
          role: "Detector channel 1 magnitude"
        - ui_tree: "Demodulators/4/Sample/R"
          api_path: "demods/3/sample.r"
          role: "Detector channel 2 magnitude"
      trigger:
        source: DIO1
        ui_tree: "Plotter trigger source = DIO1, Trigger Mode = Rising"
        demodulator_trigger_node: "demods/{0,3}/trigger"
        demodulator_trigger_value: 0
        trigger_name: "continuous demodulator stream; DIO1 reserved for Plotter UI trigger"
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "runs/YYYYMMDD_mircat_detector_alignment"

  detector_alignment_internal:
    purpose: "MIRcat internal-pulse detector alignment for LabOne Plotter visualization without T660 timing."
    operator_checks:
      - "Confirm MIRcat is configured for internal pulsed emission before opening emission."
      - "Confirm detector response remains within approved dynamic range during alignment."
      - "Use LabOne Plotter directly; add Demod 1 Sample R and Demod 4 Sample R."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: false
    oscillators:
      - index: 0
        frequency_hz: 2000000.0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        trigger_name: "continuous"
        enable: true
    labone_plotter:
      mode: "Use LabOne Plotter directly; the UI does not replicate detector plotting."
      plotter_run_mode: "roll mode with continuous demodulator samples using HF2LI oscillator 0 at 2 MHz"
      api_control: false
      note: "This mode does not require T660-2. It uses the HF2LI internal oscillator at the nominal MIRcat pulse rate for live alignment display."
      signals:
        - ui_tree: "Demodulators/1/Sample/R"
          api_path: "demods/0/sample.r"
          role: "Detector channel 1 magnitude"
        - ui_tree: "Demodulators/4/Sample/R"
          api_path: "demods/3/sample.r"
          role: "Detector channel 2 magnitude"
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "runs/YYYYMMDD_mircat_detector_alignment_internal"

  campaign_step_scan_candidate:
    purpose: "Provisional engineering seed for separate HRP-C-CO and MbCO HF-01/AR-01 qualification; not evidence that their settings are equivalent and not approved for biological acquisition."
    qualification_plan: "calibration/system_recalibration_001/plans/hf01_awg_parameter_characterization.md"
    operator_checks:
      - "Confirm the approved calibration or characterization phase ID before acquisition."
      - "Confirm MIRcat setpoint/actual wavelength and full configuration are saved for every point."
      - "Do not use this candidate after HF-01/AR-01 without replacing it with the accepted configuration ID."
      - "Qualify acquisition rate, time constant, filter order, settling/bias, noise/SNR, clipping, loss, and record envelope separately for HRP-C-CO and MbCO."
      - "Retain separate HRP-C-CO and MbCO configuration IDs even if measured equivalence supports identical numeric settings."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: false
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"

  campaign_sweep_qualification_candidate:
    purpose: "Provisional full-DIO sweep settings for HF-01, MD-01, and MSW-01 qualification; not approved for SV-02 or biological acquisition."
    operator_checks:
      - "Confirm the approved calibration phase and stable readback directory."
      - "Confirm MIRcat actual wavelength/readback and the complete DIO word are retained."
      - "Replace this candidate with the accepted HF-01 configuration ID before downstream use."
    signal_inputs:
      ch1:
        index: 0
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
      ch2:
        index: 1
        ac: false
        impedance_50ohm: true
        differential: false
        range_v: 1.0
    pll:
      index: 0
      enable: true
      adcselect: 4
      freqcenter_hz: 2000000.0
      harmonic: 1
      order: 4
      adcthreshold: 0
    demodulators:
      - index: 0
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      - index: 3
        adcselect: 1
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        rate_sps: 2000.0
        trigger: 0
        enable: true
      # LabOne Demodulator 3 (API index 2) carries the global DIO word used
      # for sweep timing. It is intentionally not assigned to a detector.
      - index: 2
        adcselect: 0
        oscselect: 0
        harmonic: 1
        order: 4
        timeconstant_s: 0.001
        # At 5 kSa/s a 500 us MIRcat wavelength-trigger pulse spans about
        # 2.5 samples. The sweep workflow applies and verifies the pulse width.
        rate_sps: 5000.0
        trigger: 0
        enable: true
    acquisition:
      duration_s: 5.0
      demodulators: [0, 3]
      fields: ["x", "y", "r"]
      expected_output: "USER_INPUT_REQUIRED_APPROVED_PHASE_DIRECTORY"
