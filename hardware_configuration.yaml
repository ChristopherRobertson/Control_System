schema_version: "0.1"

system:
  name: "IR Spectroscope"

devices:

  t660_2:
    display_name: "T660-2"
    role: "master_timing_trains_frames"
    serial_number: "00431"
    dash: 2
    preferred_port: "COM7"
    baudrate: 38400
    channel_map:
      A: "hf2li_extref"
      B: "mircat_trig_in"
      C: "hf2li_daq_trigger"
      D: "t660_1_trig_in"

  t660_1:
    display_name: "T660-1"
    role: "pump_timing"
    serial_number: "00369"
    dash: 1
    preferred_port: "COM3"
    baudrate: 38400
    trigger_input:
      source_device: "t660_2"
      source_channel: "D"
      polarity: "positive"
      termination: "50OHM"
      threshold_v: 2.0
      predivider: 1
    channel_map:
      A: "ndyag_fire"
      B: "ndyag_q_switch"
      C: "mircat_db9_pin_4_process_trigger"
      D: null

  arduino_mux:
    display_name: "Arduino MUX Controller"
    role: "mux_controller"
    enabled: false
    status: "inactive_bypassed"
    disabled_reason: "Removed from active operation until the MUX is rewired; HF2LI DIO inputs do not map to HF2LI DIO outputs."
    preferred_port: "COM6"
    baudrate: 115200
    expected_identity: "ARDUINO_MUX_V1"
    firmware_version: "0.1.0"
    protocol_version: "MUX_ROUTE_PROTOCOL_1"
    firmware_sketch: "control_app/devices/arduino_mux_firmware/arduino_mux_firmware.ino"
    command_protocol:
      identify: "WHOAMI"
      version: "VERSION"
      status: "STATUS"
      protocol: "PROTOCOL"
      query_active_route: "ROUTES?"
      set_output_a_route: "ROUTE A {route}"
      set_output_b_route: "ROUTE B {route}"
      set_output_ext_route: "ROUTE EXT {route}"
      safe_idle: "SAFE"

  mircat:
    display_name: "Daylight MIRcat"
    role: "probe_laser"
    preferred_port: "COM9"
    baudrate: "default"
    model_number: "MIRcat-QT-Z-2100"
    serial_number: "10524"
    timing_input:
      source_device: "t660_2"
      source_channel: "B"

  slopo:
    display_name: "SLOPO / Horizon OPO"
    role: "opo_controller"
    preferred_port: "COM4"
    baudrate: 9600
    serial_number: "USER INPUT REQUIRED"

  hf2li:
    display_name: "Zurich Instruments HF2LI"
    role: "lockin_amplifier"
    device_id: "18500"
    timing_inputs:
      extref:
        source_device: "t660_2"
        source_channel: "A"
      daq_trigger:
        source_device: "t660_2"
        source_channel: "C"

  picoscope:
    display_name: "PicoScope 5000 Series"
    role: "oscilloscope"
    model: "5244D"
    serial_number: "10261"
    sdk_serial_number: "10261/0071"
    sdk_api: "ps5000a"
    driver_search_paths:
      - "vendor\\picosdk\\win64"
      - "C:\\Program Files\\Pico Technology\\SDK\\lib"
      - "C:\\Program Files\\Pico Technology\\PicoScope 7 T&M Stable"
      - "C:\\Program Files\\Pico Technology\\PicoLog"
    settings_source: "workflow_recipe"
    settings_test_recipe: "recipes/picoscope_settings_test.yaml"
    capture_capabilities:
      resolutions:
        - "8BIT"
        - "12BIT"
        - "14BIT"
        - "15BIT"
        - "16BIT"
      channel_ranges:
        - "10MV"
        - "20MV"
        - "50MV"
        - "100MV"
        - "200MV"
        - "500MV"
        - "1V"
        - "2V"
        - "5V"
        - "10V"
        - "20V"
        - "50V"
      coupling_modes:
        - "AC"
        - "DC"
      analog_channels:
        - "A"
        - "B"
      trigger_sources:
        external:
          api_source: "EXT"
          ps5000a_source_value: 4
      threshold:
        units: "adc_counts"
        minimum: -32767
        maximum: 32767
      recipe_required_fields:
        - "resolution"
        - "channels.A.coupling"
        - "channels.A.range"
        - "channels.B.coupling"
        - "channels.B.range"
        - "external_trigger.source"
        - "external_trigger.threshold_adc"
        - "external_trigger.direction"
        - "total_samples"
        - "pre_trigger_samples"
        - "timebase"
        - "pulse_count_threshold_adc"

timing_routes:
  t660_ttl_routes_are_direct: true
  mux_routes_t660_ttl: false
  direct_ttl_destinations:
    t660_2_channel_a: "HF2LI DIO 0 external reference BNC"
    t660_2_channel_b: "MIRcat TRIG IN"
    t660_2_channel_c: "HF2LI DIO 1 DAQ trigger BNC"
    t660_2_channel_d: "T660-1 TRIG IN"
    t660_1_channel_a: "Nd:YAG FIRE"
    t660_1_channel_b: "Nd:YAG Q-SWITCH"
    t660_1_channel_c: "MIRcat DB9 pin 4 Process Trigger"
    t660_1_channel_d: "DISCONNECTED AND UNUSED"

arduino_mux_topology:
  enabled: false
  status: "inactive_bypassed"
  disabled_reason: "MUX routes are not valid for YAG/MIRcat sync observation; use direct scope/HF2LI input wiring."
  controller_device: "arduino_mux"
  source_document: "docs/Wiring Table.xlsx"
  control_section: "arduino_mux_control"
  routes_section: "mux_routes"
  routed_signal_sources:
    digital: "HF2LI DIO 9-15 diagnostic outputs"
    analog: "HF2LI AUX 1-4 diagnostic outputs"
  outputs:
    output_a:
      label: "MUX Output A"
      source_mux_boards:
        - "dmb1"
        - "amb1"
    output_b:
      label: "MUX Output B"
      source_mux_boards:
        - "dmb2"
        - "amb2"
    output_ext:
      label: "MUX Output EXT"
      source_mux_boards:
        - "dmb3"

picoscope_connectors:
  channel_a:
    input_label: "PicoScope Channel A"
    connector: "Front BNC"
  channel_b:
    input_label: "PicoScope Channel B"
    connector: "Front BNC"
  external_trigger:
    input_label: "PicoScope External Trigger"
    connector: "Front BNC"

arduino_mux_control:
  enabled: false
  status: "inactive_bypassed"
  disabled_reason: "Arduino MUX controls are disabled in the UI and workflow."
  source_document: "docs/Wiring Table.xlsx"
  enable_pins:
    dmb1: "D2"
    dmb2: "D3"
    amb1: "D4"
    amb2: "D5"
    dmb3: "A0"
  select_buses:
    output_a:
      boards:
        - "dmb1"
        - "amb1"
      pins:
        S0: "D6"
        S1: "D7"
        S2: "D8"
        S3: "D9"
    output_b:
      boards:
        - "dmb2"
        - "amb2"
      pins:
        S0: "D10"
        S1: "D11"
        S2: "D12"
        S3: "D13"
    output_ext:
      boards:
        - "dmb3"
      pins:
        S0: "A1"
        S1: "A2"
        S2: "A3"
        S3: "A4"

mux_routes: {}
